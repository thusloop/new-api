name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - 'release*'
      - 'release/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: new-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare image version
        id: image
        shell: bash
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$REGISTRY_HOST" =~ ^ccr\.ccs\.tencentyun\.com$ && ! "$REGISTRY_HOST" =~ ^[a-z0-9][a-z0-9.-]*\.tencentcr\.com$ ]]; then
            printf 'Set production variable REGISTRY_HOST to the Tencent registry hostname.\n' >&2
            exit 1
          fi
          if [[ ! "$REGISTRY_NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            printf 'Set production variable REGISTRY_NAMESPACE to your namespace.\n' >&2
            exit 1
          fi
          if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
            printf 'Set production secrets REGISTRY_USERNAME and REGISTRY_PASSWORD.\n' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          mirror="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/new-api"
          version="deploy-${GITHUB_SHA}"
          printf '%s\n' "$version" > VERSION
          printf 'name=%s\nmirror=%s\nversion=%s\n' "$image" "$mirror" "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64

      - name: Mirror deployment images to Tencent registry
        id: manifest
        timeout-minutes: 45
        shell: bash
        env:
          IMAGE_BASE: ${{ steps.image.outputs.mirror }}
          NEW_API_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          APP_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          images='{}'
          for entry in "$NEW_API_IMAGE new-api" 'postgres:15 postgres' \
            'redis:7.4-alpine redis' 'caddy:2-alpine caddy'; do
            read -r source service <<< "$entry"
            timeout --signal=TERM --kill-after=30s 5m docker pull --platform linux/amd64 "$source"
            image_id=$(docker image inspect -f '{{.Id}}' "$source")
            source_digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$source")
            if [[ "$service" == new-api ]]; then
              source_digest="$NEW_API_IMAGE"
              tag="$APP_VERSION"
            else
              tag="infra-${service}-${image_id#sha256:}"
            fi
            reference="${IMAGE_BASE}:${tag}"
            docker tag "$source" "$reference"
            printf 'Pushing %s image to Tencent registry (10-minute limit).\n' "$service"
            timeout --signal=TERM --kill-after=30s 10m docker push "$reference"
            # Resolve the pushed manifest, whose digest differs from the image config ID.
            reference=$(docker image inspect "$reference" | jq -er --arg prefix "$IMAGE_BASE@sha256:" \
              '.[0].RepoDigests | map(select(startswith($prefix))) | unique | if length == 1 then .[0] else error("Missing registry digest") end')
            images=$(jq -c --arg service "$service" --arg reference "$reference" \
              --arg id "$image_id" --arg source "$source_digest" \
              '. + {($service): {reference: $reference, id: $id, source: $source}}' <<< "$images")
          done
          jq -n --arg version "$APP_VERSION" --arg base "$IMAGE_BASE" --argjson images "$images" \
            '{version: $version, image_base: $base, images: $images}' > "$RUNNER_TEMP/images.json"
          read -r checksum _ < <(sha256sum "$RUNNER_TEMP/images.json")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          jq -r '.images | to_entries[] | "\(.key): \(.value.reference)"' "$RUNNER_TEMP/images.json"

      - name: Install environment and deploy over SSH
        shell: bash
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          NEW_API_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          APP_VERSION: ${{ steps.image.outputs.version }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.checksum }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$SERVER_PORT >= 1 && 10#$SERVER_PORT <= 65535))
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$APP_DOMAIN" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,63}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/known_hosts"
          ssh_options=(
            -i "$RUNNER_TEMP/deploy_key" -p "$SERVER_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4
          )
          destination="${SERVER_USER}@${SERVER_HOST}"
          remote_dir=''
          remote_started=false
          cleanup() {
            if ! $remote_started && [[ "$remote_dir" =~ ^/var/tmp/new-api-deploy\.[a-zA-Z0-9]+$ ]]; then
              printf 'Deployment files retained: %s.\n' "$remote_dir"
            fi
            rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
          }
          trap cleanup EXIT

          remote_dir=$(ssh "${ssh_options[@]}" "$destination" \
            'umask 077; sudo -n flock -n /var/lock/new-api-production.lock -c true && mktemp -d /var/tmp/new-api-deploy.XXXXXXXX')
          [[ "$remote_dir" =~ ^/var/tmp/new-api-deploy\.[a-zA-Z0-9]+$ ]]
          printf 'Transferring deployment configuration over SSH (2-minute limit).\n'
          # shellcheck disable=SC2029
          tar -czf - -C deploy/production compose.yml Caddyfile deploy.sh \
            -C "$RUNNER_TEMP" images.json |
            timeout --signal=TERM --kill-after=30s 2m ssh "${ssh_options[@]}" "$destination" \
              "umask 077; timeout --signal=TERM --kill-after=30s 3m tar -xzf - -C '$remote_dir'"

          printf -v remote_command 'sudo -n timeout --signal=TERM --kill-after=30s 60m bash %q %q %q %q %q' \
            "$remote_dir/deploy.sh" "$APP_DOMAIN" "$NEW_API_IMAGE" "$APP_VERSION" "$MANIFEST_SHA256"
          remote_started=true
          # Credentials travel only through encrypted stdin, never command arguments or deployment files.
          # shellcheck disable=SC2029
          jq -n '{username: env.REGISTRY_USERNAME, password: env.REGISTRY_PASSWORD}' |
            ssh "${ssh_options[@]}" "$destination" "$remote_command"

          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 20 \
            "https://$APP_DOMAIN/api/status" |
            jq -e --arg version "$APP_VERSION" \
              '.success == true and .data.version == $version' > /dev/null
          printf 'Deployed %s\n\nURL: https://%s\n\nImage: %s\n' \
            "$APP_VERSION" "$APP_DOMAIN" "$NEW_API_IMAGE" >> "$GITHUB_STEP_SUMMARY"
