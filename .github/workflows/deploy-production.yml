name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - 'release*'
      - 'release/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: new-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare image version
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="deploy-${GITHUB_SHA}"
          printf '%s\n' "$version" > VERSION
          printf 'name=%s\nversion=%s\n' "$image" "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64

      - name: Prepare deployment image archive
        id: archive
        timeout-minutes: 15
        shell: bash
        env:
          IMAGE_BASE: ${{ steps.image.outputs.name }}
          NEW_API_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          APP_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          images='{}'
          references=()
          for entry in "$NEW_API_IMAGE new-api" 'postgres:15 postgres' \
            'redis:7.4-alpine redis' 'caddy:2-alpine caddy'; do
            read -r source service <<< "$entry"
            docker pull "$source"
            image_id=$(docker image inspect -f '{{.Id}}' "$source")
            reference="${IMAGE_BASE}:${APP_VERSION}-${service}-${image_id#sha256:}"
            docker tag "$source" "$reference"
            source_digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$source")
            if [[ "$service" == new-api ]]; then
              source_digest="$NEW_API_IMAGE"
            fi
            images=$(jq -c --arg service "$service" --arg reference "$reference" \
              --arg id "$image_id" --arg source "$source_digest" \
              '. + {($service): {reference: $reference, id: $id, source: $source}}' <<< "$images")
            references+=("$reference")
          done
          jq -n --arg version "$APP_VERSION" --arg base "$IMAGE_BASE" --argjson images "$images" \
            '{version: $version, image_base: $base, images: $images}' > "$RUNNER_TEMP/images.json"
          docker save "${references[@]}" | gzip -6 > "$RUNNER_TEMP/images.tar.gz"
          read -r checksum _ < <(sha256sum "$RUNNER_TEMP/images.tar.gz")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/images.tar.gz"

      - name: Install environment and deploy over SSH
        shell: bash
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          NEW_API_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          APP_VERSION: ${{ steps.image.outputs.version }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.checksum }}
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$SERVER_PORT >= 1 && 10#$SERVER_PORT <= 65535))
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$APP_DOMAIN" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,63}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/known_hosts"
          ssh_options=(
            -i "$RUNNER_TEMP/deploy_key" -p "$SERVER_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4
          )
          destination="${SERVER_USER}@${SERVER_HOST}"
          remote_dir=''
          remote_started=false
          cleanup() {
            # Retain failed transfers so another run of the same commit can reuse them.
            if ! $remote_started && [[ "$remote_dir" =~ ^/var/tmp/new-api-deploy\.[a-zA-Z0-9]+$ ]]; then
              printf 'Transfer directory retained: %s. Rerun this commit to resume.\n' "$remote_dir"
            fi
            rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
          }
          trap cleanup EXIT

          command -v rsync > /dev/null
          ssh "${ssh_options[@]}" "$destination" 'sudo -n timeout --signal=TERM --kill-after=30s 5m bash -c '\''
            if ! command -v rsync > /dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o DPkg::Lock::Timeout=120 update &&
                apt-get -o DPkg::Lock::Timeout=120 install -y rsync
            fi
          '\'''
          remote_dir="/var/tmp/new-api-deploy.${GITHUB_SHA}"
          [[ "$remote_dir" =~ ^/var/tmp/new-api-deploy\.[a-zA-Z0-9]+$ ]]
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$destination" \
            "umask 077; sudo -n flock -n /var/lock/new-api-production.lock -c true && test ! -L '$remote_dir' && mkdir -p -- '$remote_dir' && test -O '$remote_dir'"
          printf -v rsync_ssh '%q ' ssh "${ssh_options[@]}"
          rsync_destination="$destination"
          if [[ "$SERVER_HOST" == *:* ]]; then
            rsync_destination="${SERVER_USER}@[${SERVER_HOST}]"
          fi
          # Bound the remote receiver too, including when the runner disconnects.
          rsync_receiver="timeout --signal=TERM --kill-after=30s 61m flock -n '$remote_dir/.transfer.lock' rsync"
          printf 'Transferring deployment images with progress and resume (60-minute limit).\n'
          timeout --signal=TERM --kill-after=30s 60m \
            rsync --recursive --times --partial --partial-dir=.rsync-partial \
              --info=progress2 --human-readable --timeout=120 --chmod=F600,D700 \
              --rsync-path="$rsync_receiver" -e "$rsync_ssh" \
              deploy/production/compose.yml deploy/production/Caddyfile deploy/production/deploy.sh \
              "$RUNNER_TEMP/images.json" "$RUNNER_TEMP/images.tar.gz" \
              "${rsync_destination}:${remote_dir}/"

          printf -v remote_command 'sudo -n timeout --signal=TERM --kill-after=30s 30m bash %q %q %q %q %q' \
            "$remote_dir/deploy.sh" "$APP_DOMAIN" "$NEW_API_IMAGE" "$APP_VERSION" "$ARCHIVE_SHA256"
          remote_started=true
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$destination" "$remote_command"

          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 20 \
            "https://$APP_DOMAIN/api/status" |
            jq -e --arg version "$APP_VERSION" \
              '.success == true and .data.version == $version' > /dev/null
          printf 'Deployed %s\n\nURL: https://%s\n\nImage: %s\n' \
            "$APP_VERSION" "$APP_DOMAIN" "$NEW_API_IMAGE" >> "$GITHUB_STEP_SUMMARY"
